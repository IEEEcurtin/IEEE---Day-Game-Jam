<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Key Tiles</title>
<style>
  html, body { margin: 0; height: 100%; background: #22223b; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { background: #f2e9e4; max-width: 100%; max-height: 100%; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="c" width="400" height="600"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = c.width, H = c.height;
// Q W O P for each lane (F G H J also work as a backup)
const KEYS = [['KeyQ', 'KeyF'], ['KeyW', 'KeyG'], ['KeyO', 'KeyH'], ['KeyP', 'KeyJ']];
const LABELS = ['Q', 'W', 'O', 'P'];
const NOTES = [261.6, 329.6, 392.0, 523.3]; // C, E, G, high C
const LANE = W / 4, TH = 140;

let tiles, score, best = 0, speed, state, flash;
let audio = null;

function beep(lane) {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'triangle';
  o.frequency.value = NOTES[lane];
  g.gain.setValueAtTime(0.3, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.3);
  o.connect(g).connect(audio.destination);
  o.start();
  o.stop(audio.currentTime + 0.3);
}

function randLane() { return Math.floor(Math.random() * 4); }

function reset() {
  tiles = [];
  for (let i = 0; i < 6; i++) tiles.push({ lane: randLane(), y: H - TH * (i + 2), hit: false });
  score = 0;
  speed = 3;
  state = 'ready';
  flash = null;
}

function target() { return tiles.find(t => !t.hit); }

function press(lane) {
  if (state === 'over') { reset(); return; }
  const t = target();
  if (lane === t.lane) {
    t.hit = true;
    score++;
    speed = Math.min(12, speed + 0.05);
    beep(lane);
    state = 'play';
  } else if (state === 'play') {
    flash = lane;
    gameOver();
  }
}

function gameOver() {
  state = 'over';
  best = Math.max(best, score);
  // Tell the IEEE arcade menu the score (does nothing when played on its own)
  if (window.parent !== window) window.parent.postMessage({ type: 'arcade:over', score }, '*');
}

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  const lane = KEYS.findIndex(k => k.includes(e.code));
  if (lane >= 0) press(lane);
  else if (e.code === 'Space' && state === 'over') { e.preventDefault(); reset(); }
});
c.addEventListener('pointerdown', e => {
  const r = c.getBoundingClientRect();
  press(Math.floor((e.clientX - r.left) / r.width * 4));
});

function update() {
  if (state !== 'play') return;
  for (const t of tiles) t.y += speed;
  const top = tiles[tiles.length - 1];
  if (top.y > -TH) tiles.push({ lane: randLane(), y: top.y - TH, hit: false });
  const t = target();
  if (t.y > H) { flash = t.lane; gameOver(); }
  tiles = tiles.filter(t => t.y < H + TH);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // lane lines
  ctx.strokeStyle = '#c9ada7';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(i * LANE, 0); ctx.lineTo(i * LANE, H); ctx.stroke();
  }

  // wrong-key flash
  if (flash !== null) {
    ctx.fillStyle = '#e63946';
    ctx.fillRect(flash * LANE, 0, LANE, H);
  }

  // tiles
  for (const t of tiles) {
    ctx.fillStyle = t.hit ? '#c9ada7' : '#22223b';
    ctx.fillRect(t.lane * LANE + 2, t.y + 2, LANE - 4, TH - 4);
  }

  // key labels along the bottom
  ctx.fillStyle = 'rgba(74, 78, 105, 0.85)';
  ctx.fillRect(0, H - 50, W, 50);
  ctx.fillStyle = '#f2e9e4';
  ctx.textAlign = 'center';
  ctx.font = 'bold 26px system-ui, sans-serif';
  LABELS.forEach((l, i) => ctx.fillText(l, i * LANE + LANE / 2, H - 16));

  // score and messages
  ctx.fillStyle = '#e63946';
  ctx.font = 'bold 44px system-ui, sans-serif';
  ctx.fillText(score, W / 2, 60);

  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.fillStyle = '#22223b';
  if (state === 'ready') {
    ctx.fillStyle = 'rgba(242, 233, 228, 0.9)';
    ctx.fillRect(40, 90, W - 80, 80);
    ctx.fillStyle = '#22223b';
    ctx.fillText('Hit the key under the', W / 2, 124);
    ctx.fillText('lowest dark tile to start', W / 2, 150);
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(242, 233, 228, 0.9)';
    ctx.fillRect(40, H / 2 - 60, W - 80, 110);
    ctx.fillStyle = '#22223b';
    ctx.fillText('Game over. Best: ' + best, W / 2, H / 2 - 20);
    ctx.fillText('Press space to try again', W / 2, H / 2 + 16);
  }
}

// Fixed 60 steps a second, so tiles fall at the same speed on any screen
// (otherwise they run in slow motion on slow screens and too fast on 120/144 Hz ones)
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
