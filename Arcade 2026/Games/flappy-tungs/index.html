<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stomp Birds</title>
<style>
  html,body{margin:0;height:100%;background:#1b1330;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{max-width:100%;max-height:100%;aspect-ratio:16/9;background:#000}
  #usb{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);padding:10px 18px;font:bold 16px "Trebuchet MS","Segoe UI",sans-serif;background:#ff5d8f;color:#fff;border:0;border-radius:8px;cursor:pointer}
  #usb.ok{background:#2f9e5b}
  #usb{z-index:10}
  .ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,8,30,.88);z-index:5;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:#fff}
  .card{background:#2a1d4a;border:2px solid #5b4a8a;border-radius:14px;padding:26px 30px;width:min(420px,86vw);text-align:center}
  .card h1,.card h2{margin:0 0 6px;font-size:28px}
  .card p{margin:6px 0 14px;color:#cfc6ea;font-size:15px}
  .card label{display:block;text-align:left;margin:10px 0 4px;font-weight:bold;font-size:15px}
  .card input{width:100%;box-sizing:border-box;padding:10px 12px;font:18px "Trebuchet MS","Segoe UI",sans-serif;border-radius:8px;border:2px solid #5b4a8a;background:#150d2b;color:#fff}
  .card input:focus{outline:none;border-color:#ffe08a}
  .card button{display:block;width:100%;margin-top:12px;padding:12px;font:bold 17px "Trebuchet MS","Segoe UI",sans-serif;border:0;border-radius:8px;cursor:pointer;color:#fff}
  #go,#keep{background:#2f9e5b}
  #change{background:#6b5aa8}
  #lbBtn{background:#d49a1a}
  #lbBack{background:#6b5aa8}
  #lbList{text-align:left;max-height:46vh;overflow:auto;margin:10px 0 4px}
  .row{display:flex;gap:10px;padding:6px 10px;border-radius:6px;font-size:16px}
  .row span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.me{background:#3a2b66;color:#ffe08a}
  .row.top{font-weight:bold}
  #err{color:#ff8a8a;min-height:18px;margin:8px 0 0;font-size:14px}
</style>
</head>
<body>
<button id="usb">Connect pedals (USB)</button>
<canvas id="c" width="960" height="540"></canvas>
<div id="ovNames" class="ov"><div class="card">
  <h1>Stomp Birds</h1>
  <p>First to 3 round wins takes the match</p>
  <label for="n1">Player 1 (left lane)</label>
  <input id="n1" maxlength="12" placeholder="Enter name" autocomplete="off">
  <label for="n2">Player 2 (right lane)</label>
  <input id="n2" maxlength="12" placeholder="Enter name" autocomplete="off">
  <p id="err"></p>
  <button id="go">Start game</button>
</div></div>
<div id="ovEnd" class="ov" style="display:none"><div class="card">
  <h2 id="endTitle"></h2>
  <p id="endScore"></p>
  <p>Keep the same names?</p>
  <button id="keep">Keep same names (stomp pedal 1)</button>
  <button id="change">Change names (stomp pedal 2)</button>
  <button id="lbBtn">Leaderboard</button>
</div></div>
<div id="ovLB" class="ov" style="display:none;z-index:6"><div class="card">
  <h2>Leaderboard</h2>
  <p>Best distance covered, in metres</p>
  <div id="lbList"></div>
  <button id="lbBack">Back (or stomp a pedal)</button>
</div></div>

<script>
// ===== Stomp Birds: 2-player Flappy Bird for stomp pedals =====
// Player 1 pedal sends "a", Player 2 pedal sends "l".
// Keyboard fallback for testing: A / L (also Left Shift / Right Shift... not needed).
const KEY_P1 = 'a', KEY_P2 = 'l';
// Inside the IEEE arcade (?arcade=1) the name screen is skipped so pedals alone can start a match
const ARCADE = new URLSearchParams(location.search).has('arcade');
// Solo (?solo=1): one player flies the angel and the computer flies the devil
const SOLO = new URLSearchParams(location.search).has('solo');
const cpu = { failAt: 0, cool: 0 }; // the devil slips up after failAt gaps, a different number each round
let matchBest = [0, 0]; // best distance per player this match, in metres

const c = document.getElementById('c'), g = c.getContext('2d');
const W = 480, H = 540, FLOOR = H - 44;
const GAP = 180, PW = 64, SPACING = 240, LEAD = 120;
const SPEED = 2.6, GRAV = 0.34, FLAP = -6.7, BX = 110, R = 16;
const COLORS = ['#ffe08a', '#ff5a4a'];
let names = ['ANGEL', 'DEVIL'], named = false, endShown = false;
const WIN_LIMIT = 3;
const FONT = '"Trebuchet MS","Segoe UI",sans-serif';

let state, wins = [0, 0], rand, gaps, laneDist, birds, ready, cd, winner, overAt, frame, pulse = [0, 0];

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function gapY(i) {
  while (gaps.length <= i) gaps.push(80 + rand() * (FLOOR - GAP - 160));
  return gaps[i];
}
function reset() {
  rand = mulberry32((Math.random() * 1e9) | 0);
  gaps = []; laneDist = [0, 0]; frame = 0; winner = null;
  birds = [0, 1].map(() => ({ y: H / 2, v: 0, alive: true, score: 0, diedAt: 0 }));
  ready = [false, false];
  state = 'ready';
  if (SOLO) {
    ready[1] = true;
    cpu.failAt = 4 + Math.floor(Math.random() * 12);
    cpu.cool = 0;
  }
}

// The computer devil: flaps whenever it drops near the bottom of the next gap
function cpuFly(b) {
  if (b.score >= cpu.failAt) return; // this round's slip-up
  if (cpu.cool > 0) { cpu.cool--; return; }
  const d = laneDist[1];
  const first = Math.max(0, Math.floor((d - LEAD - W) / SPACING));
  for (let i = first; i < first + 4; i++) {
    const px = W + LEAD + i * SPACING - d;
    if (px + PW < BX - R) continue; // already passed this pillar
    if (b.y > gapY(i) + GAP - R - 34 && b.v > -2) {
      b.v = FLAP; pulse[1] = 8; cpu.cool = 8;
    }
    return;
  }
}
reset();

const $ = id => document.getElementById(id);
const ovNames = $('ovNames'), ovEnd = $('ovEnd'), n1 = $('n1'), n2 = $('n2'), errEl = $('err');

function showNames() {
  state = 'names';
  n1.value = named ? names[0] : ''; n2.value = named ? names[1] : '';
  errEl.textContent = '';
  ovEnd.style.display = 'none'; ovNames.style.display = 'flex';
  n1.focus();
}
function startGame() {
  const a = n1.value.trim(), b = n2.value.trim();
  if (!a || !b) {
    errEl.textContent = 'Enter a name for both players';
    (!a ? n1 : n2).focus();
    return;
  }
  names = [a, b]; named = true;
  ovNames.style.display = 'none';
  if (document.activeElement) document.activeElement.blur();
  wins = [0, 0]; matchBest = [0, 0]; reset();
}
function showEnd() {
  $('endTitle').textContent = names[winner] + ' wins the match!';
  $('endScore').textContent = names[0] + ' ' + wins[0] + '  -  ' + wins[1] + ' ' + names[1];
  ovEnd.style.display = 'flex'; endShown = true;
}
function keepNames() {
  if (!endShown) return;
  endShown = false; ovEnd.style.display = 'none';
  if (document.activeElement) document.activeElement.blur();
  wins = [0, 0]; matchBest = [0, 0]; reset();
}
function changeNames() {
  if (!endShown) return;
  endShown = false; showNames();
}
$('go').addEventListener('click', startGame);
$('keep').addEventListener('click', keepNames);
$('change').addEventListener('click', changeNames);
n1.addEventListener('keydown', e => { if (e.key === 'Enter') n2.focus(); });
n2.addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });

const LB_KEY = 'stompBirdsLB';
let lbMem = [], lbOpen = false;
const toMeters = d => Math.round(d / 20);
function loadLB() {
  try { const a = JSON.parse(localStorage.getItem(LB_KEY) || 'null'); if (Array.isArray(a)) return a; } catch (e) {}
  return lbMem;
}
function saveLB(a) {
  lbMem = a;
  try { localStorage.setItem(LB_KEY, JSON.stringify(a)); } catch (e) {}
}
function recordDist(name, m) {
  let a = loadLB();
  const e = a.find(x => x.name.toLowerCase() === name.toLowerCase());
  if (e) { if (m > e.m) e.m = m; } else a.push({ name, m });
  a.sort((x, y) => y.m - x.m);
  saveLB(a.slice(0, 20));
}
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function openLB() {
  const a = loadLB().slice(0, 10);
  $('lbList').innerHTML = a.length ? a.map((x, i) =>
    '<div class="row' + (i === 0 ? ' top' : '') + (names.includes(x.name) ? ' me' : '') + '"><span>' + (i + 1) + '.</span><span>' + esc(x.name) + '</span><span>' + x.m + ' m</span></div>'
  ).join('') : '<p>No runs yet.</p>';
  $('ovLB').style.display = 'flex'; lbOpen = true;
}
function closeLB() { $('ovLB').style.display = 'none'; lbOpen = false; }
$('lbBtn').addEventListener('click', openLB);
$('lbBack').addEventListener('click', closeLB);

function press(p) {
  if (state === 'names') return;
  if (SOLO && p === 1) return; // the computer flies the devil
  pulse[p] = 8;
  if (state === 'ready') {
    ready[p] = true;
    if (ready[0] && ready[1]) { state = 'count'; cd = 180; }
  } else if (state === 'play') {
    if (birds[p].alive) birds[p].v = FLAP;
  } else if (state === 'over') {
    if (performance.now() - overAt > 1200) reset();
  } else if (state === 'matchover') {
    if (lbOpen) closeLB(); else if (endShown) { if (p === 0) keepNames(); else changeNames(); }
  }
}
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === KEY_P1) press(0);
  else if (k === KEY_P2) press(1);
});

function endRound(w) {
  winner = w;
  overAt = performance.now();
  recordDist(names[0], toMeters(laneDist[0]));
  recordDist(names[1], toMeters(laneDist[1]));
  matchBest =matchBest.map((m, p) => Math.max(m, toMeters(laneDist[p])));
  if (w >= 0) wins[w]++;
  if (w >= 0 && wins[w] >= WIN_LIMIT) {
    state = 'matchover'; endShown = false;
    setTimeout(showEnd, 1500);
    // Tell the IEEE arcade menu who won and how far they flew (does nothing when played on its own).
    // Solo scores the player's best distance whether or not they beat the devil.
    const result = SOLO
      ? { score: matchBest[0], title: w === 0 ? 'YOU BEAT THE DEVIL!' : 'THE DEVIL WINS' }
      : { score: matchBest[w], winner: w, winnerName: names[w] };
    if (window.parent !== window) window.parent.postMessage(Object.assign({ type: 'arcade:over' }, result), '*');
  } else state = 'over';
}

function update() {
  frame++;
  pulse = pulse.map(v => Math.max(0, v - 1));
  if (state === 'names') return;
  if (state === 'ready' || state === 'count') {
    birds.forEach((b, i) => b.y = H / 2 + Math.sin(frame / 14 + i) * 8);
    if (state === 'count' && --cd <= 0) {
      state = 'play';
      birds.forEach(b => { b.y = H / 2; b.v = FLAP; });
    }
    return;
  }
  birds.forEach((b, p) => {
    if (!b.alive) {
      if (b.y < FLOOR - R) { b.v += GRAV; b.y = Math.min(FLOOR - R, b.y + b.v); }
      return;
    }
    if (state !== 'play') return;
    if (SOLO && p === 1) cpuFly(b);
    laneDist[p] += SPEED;
    const d = laneDist[p];
    b.v += GRAV; b.y += b.v;
    let dead = b.y < R || b.y > FLOOR - R;
    const first = Math.max(0, Math.floor((d - LEAD - W) / SPACING));
    for (let i = first; i < first + 4; i++) {
      const px = W + LEAD + i * SPACING - d, gy = gapY(i);
      if (BX + R > px && BX - R < px + PW && (b.y - R < gy || b.y + R > gy + GAP)) dead = true;
    }
    b.score = Math.max(0, Math.floor((d - W - LEAD + BX - R - PW) / SPACING) + 1);
    if (dead) { b.alive = false; b.diedAt = frame; if (b.y > FLOOR - R) b.y = FLOOR - R; }
  });
  if (state === 'play') {
    const [a, b] = birds;
    if (!a.alive && !b.alive) {
      if (a.score !== b.score) endRound(a.score > b.score ? 0 : 1);
      else if (a.diedAt !== b.diedAt) endRound(a.diedAt > b.diedAt ? 0 : 1);
      else endRound(-1);
    }
  }
}

function drawLane(p) {
  const b = birds[p];
  const dist = laneDist[p];
  g.save();
  g.translate(p * W, 0);
  g.beginPath(); g.rect(0, 0, W, H); g.clip();
  // sky
  const sky = g.createLinearGradient(0, 0, 0, H);
  if (p) { sky.addColorStop(0, '#1a0505'); sky.addColorStop(0.6, '#5c1410'); sky.addColorStop(1, '#b8431a'); }
  else { sky.addColorStop(0, '#3b6fb0'); sky.addColorStop(1, '#bfe0f5'); }
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  const wrap = (v, m) => ((v % m) + m) % m;
  if (p) {
    g.fillStyle = 'rgba(255,150,70,.6)';
    for (let k = 0; k < 16; k++) {
      const sx = wrap(k * 131 - dist * 0.3, W + 40) - 20;
      const sy = FLOOR - wrap(k * 89 + frame * (0.4 + (k % 3) * 0.25), FLOOR);
      g.fillRect(sx, sy, 3, 3);
    }
  } else {
    const puff = (cx, cy, sc, a) => {
      g.fillStyle = 'rgba(255,255,255,' + a + ')';
      [[-28, 2, 18], [-6, -12, 24], [22, -6, 20], [42, 4, 14], [6, 4, 20]].forEach(([dx, dy, r]) => {
        g.beginPath(); g.arc(cx + dx * sc, cy + dy * sc, r * sc, 0, 7); g.fill();
      });
      g.beginPath(); g.ellipse(cx + 8 * sc, cy + 14 * sc, 52 * sc, 8 * sc, 0, 0, 7); g.fill();
    };
    [[0, 110, 0.7, 0.45, 0.12], [230, 215, 0.75, 0.45, 0.14], [110, 330, 0.7, 0.4, 0.12],
     [330, 160, 1.15, 0.85, 0.32], [60, 275, 1.2, 0.85, 0.36], [260, 390, 1.1, 0.8, 0.3]].forEach(([x0, y, sc, a, sp]) => {
      puff(wrap(x0 - dist * sp, W + 220) - 110, y, sc, a);
    });
  }
  // spikes
  const first = Math.max(0, Math.floor((dist - LEAD - W - PW) / SPACING));
  const body = p ? '#c62828' : '#f6f8fc', shade = p ? '#7d1212' : '#c3cade', edge = p ? '#2a0404' : '#46506e';
  const SH = 46, N = 4, SW = PW / N;
  const column = (px, yEdge, dir) => {
    const yb = yEdge - dir * SH, y0 = dir > 0 ? -2 : FLOOR + 2;
    const top = Math.min(y0, yb), len = Math.abs(yb - y0);
    g.lineWidth = 2; g.strokeStyle = edge;
    g.fillStyle = body; g.fillRect(px, top, PW, len);
    g.fillStyle = shade; g.fillRect(px + PW * 0.62, top, PW * 0.38, len);
    g.strokeRect(px, top, PW, len);
    for (let k = 0; k < N; k++) {
      const xl = px + k * SW, xc = xl + SW / 2, xr = xl + SW, tip = yb + dir * (SH - 4);
      g.fillStyle = body; g.beginPath(); g.moveTo(xl, yb); g.lineTo(xr, yb); g.lineTo(xc, tip); g.closePath(); g.fill();
      g.fillStyle = shade; g.beginPath(); g.moveTo(xc, yb); g.lineTo(xr, yb); g.lineTo(xc, tip); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(xl, yb); g.lineTo(xr, yb); g.lineTo(xc, tip); g.closePath(); g.stroke();
    }
  };
  for (let i = first; i < first + 4; i++) {
    const px = W + LEAD + i * SPACING - dist, gy = gapY(i);
    column(px, gy, 1);
    column(px, gy + GAP, -1);
  }
  // ground
  if (!p) {
    const base = Math.floor(dist / 36), off = dist % 36;
    g.fillStyle = '#b9d3ec';
    for (let k = -1; k < 15; k++) {
      const idx = base + k, cx = k * 36 - off, r = 22 + ((idx * 7) % 3) * 5, cy = FLOOR + 8 + ((idx * 5) % 2) * 4;
      g.beginPath(); g.arc(cx, cy + 4, r, 0, 7); g.fill();
    }
    g.fillRect(0, FLOOR + 16, W, H - FLOOR);
    g.fillStyle = '#ffffff';
    for (let k = -1; k < 15; k++) {
      const idx = base + k, cx = k * 36 - off, r = 22 + ((idx * 7) % 3) * 5, cy = FLOOR + 8 + ((idx * 5) % 2) * 4;
      g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    }
    g.fillRect(0, FLOOR + 14, W, H - FLOOR);
    g.fillStyle = '#e3eefa';
    for (let k = -1; k < 8; k++) {
      const idx = Math.floor(dist / 70) + k, cx = k * 70 - (dist % 70) + 20;
      g.beginPath(); g.ellipse(cx, FLOOR + 30 + ((idx * 3) % 3) * 6, 26, 7, 0, 0, 7); g.fill();
    }
  } else {
    const lg = g.createLinearGradient(0, FLOOR, 0, H);
    lg.addColorStop(0, '#ff9a1f'); lg.addColorStop(0.35, '#e8420f'); lg.addColorStop(1, '#6e0a06');
    const wave = x => FLOOR + 6 + Math.sin((x + dist * 0.8) / 16 + frame / 18) * 3;
    for (let k = 0; k < 14; k++) {
      const idx = Math.floor((dist * 0.8) / 36) + k, bx = k * 36 - ((dist * 0.8) % 36) + 18;
      const h = 12 + (Math.sin(frame / 6 + idx * 1.7) + 1) * 11;
      g.fillStyle = '#ff7a18';
      g.beginPath(); g.moveTo(bx - 14, wave(bx) + 2); g.lineTo(bx + ((idx % 2) ? 4 : -4), FLOOR - h); g.lineTo(bx + 14, wave(bx) + 2); g.closePath(); g.fill();
      g.fillStyle = '#ffd23f';
      g.beginPath(); g.moveTo(bx - 7, wave(bx) + 2); g.lineTo(bx + ((idx % 2) ? 2 : -2), FLOOR - h * 0.55); g.lineTo(bx + 7, wave(bx) + 2); g.closePath(); g.fill();
    }
    g.fillStyle = lg;
    g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) g.lineTo(x, wave(x));
    g.lineTo(W, H); g.closePath(); g.fill();
    g.fillStyle = '#5a0c06';
    for (let k = 0; k < 6; k++) {
      const cx = wrap(k * 97 - dist * 0.8, W + 80) - 40;
      g.beginPath(); g.ellipse(cx, FLOOR + 26 + (k % 3) * 8, 22, 5, 0, 0, 7); g.fill();
    }
    g.fillStyle = 'rgba(255,230,120,.8)';
    for (let k = 0; k < 5; k++) {
      const bx = wrap(k * 113 - dist * 0.8, W + 40) - 20, by = FLOOR + 14 + wrap(frame * 0.6 + k * 17, 30);
      g.beginPath(); g.arc(bx, by, 2.5, 0, 7); g.fill();
    }
  }
  // character
  g.save();
  g.translate(BX, b.y);
  g.rotate(Math.max(-0.25, Math.min(0.5, b.v / 20)));
  g.globalAlpha = b.alive ? 1 : 0.5;
  const im = SPR[p];
  if (im.complete && im.naturalWidth) {
    const hh = 92, ww = hh * im.naturalWidth / im.naturalHeight;
    g.shadowColor = p ? 'rgba(255,70,30,.8)' : 'rgba(255,240,170,.9)';
    g.shadowBlur = b.alive ? 16 : 0;
    g.drawImage(im, -ww / 2, -hh / 2, ww, hh);
    g.shadowBlur = 0;
  } else {
    g.fillStyle = COLORS[p]; g.beginPath(); g.arc(0, 0, R, 0, 7); g.fill();
  }
  g.restore();
  // score
  g.textAlign = 'center';
  g.font = `bold 56px ${FONT}`;
  g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,.45)'; g.fillStyle = '#fff';
  if ((state === 'play' || state === 'over' || state === 'matchover') && (!birds[0].alive || !birds[1].alive)) {
    const dm = Math.round(dist / 20) + ' m';
    g.font = `bold 26px ${FONT}`;
    g.strokeText(dm, W / 2, 110); g.fillText(dm, W / 2, 110);
  }
  // stomp indicator
  g.fillStyle = COLORS[p];
  g.globalAlpha = 0.35 + pulse[p] / 8 * 0.65;
  g.fillRect(0, H - 8 - pulse[p], W, 8 + pulse[p]);
  g.globalAlpha = 1;
  // lane label
  g.font = `bold 22px ${FONT}`; g.textAlign = p ? 'right' : 'left';
  g.fillStyle = COLORS[p]; g.fillText(names[p], p ? W - 16 : 16, 34);
  if (state === 'ready') {
    g.textAlign = 'center';
    g.font = `bold 34px ${FONT}`; g.fillStyle = '#fff';
    g.strokeText(ready[p] ? 'READY!' : 'STOMP TO READY', W / 2, 220);
    g.fillText(ready[p] ? 'READY!' : 'STOMP TO READY', W / 2, 220);
  }
  if (!b.alive && (state === 'play' || state === 'over' || state === 'matchover')) {
    g.textAlign = 'center'; g.font = `bold 30px ${FONT}`; g.fillStyle = '#fff';
    g.strokeText('OUT', W / 2, 300); g.fillText('OUT', W / 2, 300);
  }
  g.restore();
}

function draw() {
  drawLane(0); drawLane(1);
  // divider
  g.fillStyle = '#1b1330'; g.fillRect(W - 3, 0, 6, H);
  // wins tally
  g.textAlign = 'center';
  g.fillStyle = '#1b1330'; g.fillRect(W - 62, 0, 124, 44);
  g.font = `bold 26px ${FONT}`;
  g.fillStyle = COLORS[0]; g.fillText(wins[0], W - 26, 32);
  g.fillStyle = '#fff'; g.fillText('-', W, 31);
  g.fillStyle = COLORS[1]; g.fillText(wins[1], W + 26, 32);
  g.fillStyle = '#1b1330'; g.fillRect(W - 52, 44, 104, 20);
  g.font = `bold 12px ${FONT}`; g.fillStyle = '#cfc6ea'; g.fillText('FIRST TO ' + WIN_LIMIT, W, 59);
  if (state === 'count') {
    const n = Math.ceil(cd / 60);
    g.font = `bold 140px ${FONT}`;
    g.lineWidth = 10; g.strokeStyle = 'rgba(0,0,0,.5)'; g.fillStyle = '#fff';
    g.strokeText(n, W, 300); g.fillText(n, W, 300);
  }
  if (state === 'over' || state === 'matchover') {
    g.fillStyle = 'rgba(15,8,30,.78)';
    g.fillRect(W - 230, 170, 460, 170);
    g.textAlign = 'center';
    const fit = (t, maxW, size) => { let z = size; do { g.font = `bold ${z}px ${FONT}`; z -= 2; } while (g.measureText(t).width > maxW && z > 14); };
    const head = winner < 0 ? 'DRAW' : (names[winner] + (state === 'matchover' ? ' WINS THE MATCH' : ' WINS THE ROUND')).toUpperCase();
    fit(head, 420, 40);
    g.fillStyle = winner < 0 ? '#fff' : COLORS[winner];
    g.fillText(head, W, 235);
    g.font = `22px ${FONT}`; g.fillStyle = '#fff';
    g.fillText(`${birds[0].score}  vs  ${birds[1].score}`, W, 275);
    if (state === 'over') g.fillText(performance.now() - overAt > 1200 ? 'Stomp for next round' : '...', W, 315);
  }
}

// fixed 60 Hz update so speed is the same on any monitor
let last = performance.now(), acc = 0;
function loop(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

if (ARCADE) {
  names = SOLO ? ['YOU', 'DEVIL (CPU)'] : ['ANGEL', 'DEVIL']; named = true;
  ovNames.style.display = 'none';
} else showNames();

// ===== USB pedals via Web Serial (Chrome / Edge) =====
const usbBtn = document.getElementById('usb');
if (!('serial' in navigator)) {
  usbBtn.textContent = 'USB needs Chrome or Edge (A / L keys still work)';
  usbBtn.disabled = true;
} else {
  // Pedals that were connected before reconnect by themselves, with no clicking
  navigator.serial.getPorts().then(ports => { if (ports.length) connectPedals(ports[0]); }).catch(() => {});
}
usbBtn.addEventListener('click', async () => {
  try {
    connectPedals(await navigator.serial.requestPort());
  } catch (err) {}
});
async function connectPedals(port) {
  try {
    await port.open({ baudRate: 115200 });
    usbBtn.textContent = 'Pedals connected';
    usbBtn.classList.add('ok');
    usbBtn.blur();
    const dec = new TextDecoderStream();
    port.readable.pipeTo(dec.writable);
    const reader = dec.readable.getReader();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (/P1 stomp|Piezo 1 Knock/.test(line)) press(0);
        else if (/P2 stomp|Piezo 2 Knock/.test(line)) press(1);
      }
    }
  } catch (err) {
    usbBtn.textContent = 'Connect failed - close Serial Monitor and retry';
    usbBtn.classList.remove('ok');
  }
}
</script>
